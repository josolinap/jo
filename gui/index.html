<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f5">
  <title>Jo</title>
  <meta name="description" content="Jo is a self-creating AI agent.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <div class="app-shell sidebar-collapsed" id="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="brand" id="brand-home" type="button" aria-label="Jo">
            <span class="brand-glyph" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
                <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
                <circle cx="25" cy="6" r="4" fill="var(--brand-pink, #ff91ac)" />
              </svg>
            </span>
            <span class="brand-name">Jo</span>
          </button>
          <div class="sidebar-header-actions">
            <button class="sidebar-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
            <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
            </button>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main">
          <ul>
            <li>
              <button class="nav-link" id="new-chat" type="button">
                <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
                <span class="nav-label">New chat</span>
              </button>
            </li>
          </ul>
        </nav>
        <div class="sidebar-section">
          <div class="sidebar-section-title">Chats</div>
          <div class="session-list" id="session-list"></div>
        </div>
        <div class="sidebar-bottom">
          <a class="nav-link" href="https://github.com/josolinap/jo" target="_blank" rel="noopener">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></span>
            <span class="nav-label">GitHub</span>
          </a>
          <div class="sidebar-settings" id="sidebar-settings">
            <div class="nav-link settings-label"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="nav-label">Backend</span></div>
            <label class="api-field">
              <span class="api-label">API base URL</span>
              <input id="api-base" type="text" value="https://ouroboros-agent.ai" placeholder="https://example.com" spellcheck="false">
            </label>
            <div class="backend-status" id="backend-status">Status: unknown</div>
            <div class="backend-meta" id="backend-meta"></div>
          </div>
        </div>
      </aside>
      <div class="workspace-frame">
        <div class="workspace-body">
          <main class="main-workspace">
            <div class="chat-page chat-route" id="chat-page">
              <div class="chat-top-bar">
                <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open menu" title="Menu">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                </button>
                <div class="chat-top-info">
                  <div class="chat-top-title" id="chat-title">New chat</div>
                  <div class="chat-top-sub" id="chat-subtitle">Not connected</div>
                </div>
              </div>
              <div class="conversation-scroll" id="chat-log" aria-live="polite">
                <div class="chat-collection conversation-column" id="chat-collection">
                  <div class="welcome" id="chat-empty">
                    <span class="brand-mark brand" aria-hidden="true">
                      <span class="brand-glyph"><svg viewBox="0 0 32 32" width="30" height="30" fill="none"><circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4"/><circle cx="25" cy="6" r="4" fill="var(--brand-pink, #ff91ac)"/></svg></span>
                    </span>
                    <h2 id="empty-greeting">Good evening</h2>
                    <p class="welcome-sub">I am Jo — a self-creating AI agent.</p>
                  </div>
                </div>
              </div>
              <div class="chat-bottom conversation-column">
                <form id="chat-form" class="composer" autocomplete="off">
                  <div class="composer-scroll">
                    <div class="composer-editor">
                      <textarea id="chat-input" class="composer-input" rows="1" placeholder="Message Jo…" aria-label="Message Jo"></textarea>
                    </div>
                    <div class="composer-tools">
                      <div class="composer-left">
                        <button class="button button-icon tool-button" id="chat-stop" type="button" aria-label="Stop" title="Stop generating" hidden>
                          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
                        </button>
                      </div>
                      <div class="composer-actions">
                        <button class="button button-icon send-button" id="chat-send" type="submit" aria-label="Send" title="Send" disabled>
                          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
                <div class="chat-status" id="chat-status" aria-live="polite"></div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
