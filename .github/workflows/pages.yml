name: Deploy GUI to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'gui/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate GUI
        run: |
          set -e
          node --check gui/app.js
          node --check gui/theme-init.js
          test -f gui/index.html
          test -f gui/styles.css

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
