name: Validate GUI (Pages static)

# Validates the static GUI. GitHub Pages deployment (with live backend discovery via gui/backend.json)
# is owned by .github/workflows/web-backend.yml to avoid overwriting the backend-integrated site.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - "gui/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "gui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate GUI
        run: |
          set -e
          node --check gui/app.js
          node --check gui/theme-init.js
          test -f gui/index.html
          test -f gui/styles.css
          # basic sanity: backend discovery hook present
          grep -q 'backend.json' gui/app.js
          grep -q '/v1/chat' gui/app.js

      - name: Upload GUI artifact (for inspection)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gui-static
          path: ./gui
          if-no-files-found: error
          retention-days: 7
