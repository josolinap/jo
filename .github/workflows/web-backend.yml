name: Web Backend (Pages API)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep backend/tunnel running"
        required: false
        default: "350"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  serve-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start OmniRoute (primary free-model gateway)
        id: omniroute
        continue-on-error: true
        env:
          PORT: "20128"
          HOST: "127.0.0.1"
          OMNIROUTE_HEADLESS: "1"
          OMNIROUTE_API_KEY: omniroute-local
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DOUBLEWORD_API_KEY: ${{ secrets.DOUBLEWORD_API_KEY }}
        run: |
          set -euo pipefail
          echo "Starting OmniRoute (primary provider for web backend)..."
          cat > /tmp/run_omniroute.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          while true; do
            echo "[omniroute-watchdog] starting $(date -u +%FT%TZ)" >> /tmp/omniroute.log
            npx --yes omniroute@latest serve --headless --port 20128 >> /tmp/omniroute.log 2>&1
            ec=$?
            echo "[omniroute-watchdog] exited code=$ec at $(date -u +%FT%TZ), restarting in 5s" >> /tmp/omniroute.log
            sleep 5
          done
          SH
          chmod +x /tmp/run_omniroute.sh
          nohup /tmp/run_omniroute.sh >/tmp/omniroute.watch.log 2>&1 &
          echo $! > /tmp/omniroute.pid
          up=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:20128/v1/models >/tmp/omniroute-models.json 2>/dev/null \
               || curl -fsS http://127.0.0.1:20128/health >/dev/null 2>&1 \
               || curl -fsS http://127.0.0.1:20128/ >/dev/null 2>&1; then
              echo "OmniRoute up (primary)"
              up=1
              break
            fi
            sleep 2
          done
          if [ "$up" -ne 1 ]; then
            echo "OmniRoute not ready; backend will fall back to local/direct providers"
            tail -n 120 /tmp/omniroute.log || true
            tail -n 60 /tmp/omniroute.watch.log || true
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Cache local LLM assets (llama.cpp)
        id: cache-llm
        uses: actions/cache@v4
        with:
          path: /tmp/llm
          key: web-llm-${{ runner.os }}-v1
          restore-keys: |
            web-llm-${{ runner.os }}-

      - name: Start local LLM (llama.cpp, free fallback)
        id: localllm
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/llm
          cd /tmp/llm

          # Reuse cached binary/model when available; otherwise download with fallbacks
          BIN=$(find . -type f -name 'llama-server' | head -n1 || true)
          if [ -z "$BIN" ]; then
            echo "Downloading llama.cpp server binary..."
            ok=0
            for url in \
              "https://github.com/ggml-org/llama.cpp/releases/latest/download/llama-b5621-bin-ubuntu-x64.zip" \
              "https://github.com/ggml-org/llama.cpp/releases/download/b5530/llama-b5530-bin-ubuntu-x64.zip"; do
              if curl -fsSL --retry 3 "$url" -o llama.zip; then ok=1; break; fi
            done
            if [ "$ok" -ne 1 ]; then echo "Failed to download llama.cpp binary"; exit 1; fi
            unzip -o -q llama.zip
            BIN=$(find . -type f -name 'llama-server' | head -n1 || true)
          fi
          if [ -z "$BIN" ]; then echo "llama-server not found"; find . -maxdepth 3 -type f | head; exit 1; fi
          chmod +x "$BIN" || true

          if [ ! -s model.gguf ]; then
            echo "Downloading local GGUF model..."
            curl -fL --retry 3 -o model.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
              || curl -fL --retry 3 -o model.gguf https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf
          fi

          cat > /tmp/run_llama.sh <<SH
          #!/usr/bin/env bash
          set +e
          BIN="$BIN"
          cd /tmp/llm
          while true; do
            echo "[llama-watchdog] starting \$(date -u +%FT%TZ)" >> /tmp/llama.log
            "\$BIN" -m model.gguf --host 127.0.0.1 --port 11434 -c 2048 -ngl 0 -t 2 >> /tmp/llama.log 2>&1
            ec=\$?
            echo "[llama-watchdog] exited code=\$ec at \$(date -u +%FT%TZ), restarting in 5s" >> /tmp/llama.log
            sleep 5
          done
          SH
          chmod +x /tmp/run_llama.sh
          nohup /tmp/run_llama.sh >/tmp/llama.watch.log 2>&1 &
          echo $! > /tmp/llama.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/v1/models >/tmp/llama-models.json 2>/dev/null || curl -fsS http://127.0.0.1:11434/health >/dev/null 2>&1; then
              echo "Local LLM up"; cat /tmp/llama-models.json 2>/dev/null || true; exit 0
            fi
            sleep 2
          done
          echo "Local LLM failed to start"; tail -n 150 /tmp/llama.log || true; tail -n 60 /tmp/llama.watch.log || true; exit 1

      - name: Start backend server (OmniRoute-prioritized)
        env:
          # OmniRoute is the primary source for web chat; direct providers remain as fallbacks.
          LLM_PROVIDER: omniroute
          OUROBOROS_MODEL: auto
          OUROBOROS_MODEL_CODE: ${{ vars.OUROBOROS_MODEL_CODE || '' }}
          OUROBOROS_MODEL_LIGHT: ${{ vars.OUROBOROS_MODEL_LIGHT || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DOUBLEWORD_API_KEY: ${{ secrets.DOUBLEWORD_API_KEY }}
          OMNIROUTE_BASE_URL: http://127.0.0.1:20128/v1
          OMNIROUTE_MODEL: auto
          OMNIROUTE_API_KEY: omniroute-local
          LOCAL_BASE_URL: http://127.0.0.1:11434/v1
          LOCAL_API_KEY: sk-local
          DATA_ROOT: /home/runner/.jo_data
          REPO_DIR: ${{ github.workspace }}
          OUROBOROS_DETERMINISTIC: "1"
          OUROBOROS_LLM_TEMPERATURE: "0"
          JO_WEB_USE_AGENT: "0"
        run: |
          mkdir -p /home/runner/.jo_data
          echo "=== Effective web-backend provider config ==="
          echo "LLM_PROVIDER=$LLM_PROVIDER"
          echo "OUROBOROS_MODEL=$OUROBOROS_MODEL"
          echo "OMNIROUTE_BASE_URL=$OMNIROUTE_BASE_URL"
          echo "OMNIROUTE_MODEL=$OMNIROUTE_MODEL"
          echo "LOCAL_BASE_URL=$LOCAL_BASE_URL"
          cat > /tmp/run_uvicorn.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          cd "${REPO_DIR:-$GITHUB_WORKSPACE}"
          while true; do
            echo "[uvicorn-watchdog] starting $(date -u +%FT%TZ)" >> /tmp/uvicorn.log
            python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 >> /tmp/uvicorn.log 2>&1
            ec=$?
            echo "[uvicorn-watchdog] exited code=$ec at $(date -u +%FT%TZ), restarting in 3s" >> /tmp/uvicorn.log
            sleep 3
          done
          SH
          chmod +x /tmp/run_uvicorn.sh
          nohup env \
            LLM_PROVIDER="$LLM_PROVIDER" \
            OUROBOROS_MODEL="$OUROBOROS_MODEL" \
            OUROBOROS_MODEL_CODE="$OUROBOROS_MODEL_CODE" \
            OUROBOROS_MODEL_LIGHT="$OUROBOROS_MODEL_LIGHT" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            DOUBLEWORD_API_KEY="$DOUBLEWORD_API_KEY" \
            OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
            OMNIROUTE_MODEL="$OMNIROUTE_MODEL" \
            OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
            LOCAL_BASE_URL="$LOCAL_BASE_URL" \
            LOCAL_API_KEY="$LOCAL_API_KEY" \
            DATA_ROOT="$DATA_ROOT" \
            REPO_DIR="$REPO_DIR" \
            OUROBOROS_DETERMINISTIC="$OUROBOROS_DETERMINISTIC" \
            OUROBOROS_LLM_TEMPERATURE="$OUROBOROS_LLM_TEMPERATURE" \
            JO_WEB_USE_AGENT="$JO_WEB_USE_AGENT" \
            /tmp/run_uvicorn.sh >/tmp/uvicorn.watch.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              echo "Backend up"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"; tail -n 200 /tmp/uvicorn.log || true; tail -n 80 /tmp/uvicorn.watch.log || true; exit 1

      - name: Start tunnel
        run: |
          set -e
          url=""
          # Try cloudflared quick tunnel
          if [ -z "$url" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared || true
            if [ -f /usr/local/bin/cloudflared ]; then
              chmod +x /usr/local/bin/cloudflared
              cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/tunnel.log 2>&1 &
              echo $! > /tmp/tunnel.pid
              for i in $(seq 1 45); do
                url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n1 || true)
                if [ -n "$url" ]; then break; fi
                sleep 2
              done
              if [ -z "$url" ]; then
                echo "cloudflared did not provide URL, trying localtunnel..."
                kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true
              fi
            fi
          fi
          # Fallback: localtunnel
          if [ -z "$url" ]; then
            npx --yes localtunnel --port 8000 > /tmp/tunnel.log 2>&1 &
            echo $! > /tmp/tunnel.pid
            for i in $(seq 1 45); do
              url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' /tmp/tunnel.log | head -n1 || true)
              url=${url:-$(grep -oE 'https://[^ ]+' /tmp/tunnel.log | grep -v 'localtunnel.me' | head -n1 || true)}
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi
          if [ -z "$url" ]; then
            echo "Failed to obtain tunnel URL"; tail -n 200 /tmp/tunnel.log || true; exit 1
          fi
          echo "TUNNEL_URL=$url" >> "$GITHUB_ENV"
          URL="$url" python -c 'import json,os,time; url=os.environ["URL"]; d={"apiBase":url,"updatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"commit":os.environ.get("GITHUB_SHA",""),"runId":os.environ.get("GITHUB_RUN_ID",""),"workflow":"web-backend"}; open("gui/backend.json","w",encoding="utf-8").write(json.dumps(d,separators=(",",":"))+"\n"); print(json.dumps(d))'
          echo "Tunnel: $url"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (GUI + backend discovery)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gui

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Smoke test and summary
        if: always() && env.TUNNEL_URL != ''
        run: |
          set +e
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## Web Backend Deploy"
            echo ""
            echo "- **Commit:** `${{ github.sha }}`"
            echo "- **Published apiBase:** ${TUNNEL_URL:-"(missing)"}"
            echo "- **Pages URL:** ${{ steps.deployment.outputs.page_url }}"
            echo "- **OmniRoute step:** ${{ steps.omniroute.outcome }}"
            echo "- **Local LLM step:** ${{ steps.localllm.outcome }}"
            echo ""
          } >> "$SUMMARY"

          curl -fsS --max-time 20 "http://127.0.0.1:8000/health" > /tmp/health.json 2>/tmp/health.err; H=$?
          curl -fsS --max-time 20 "http://127.0.0.1:8000/v1/status" > /tmp/status.json 2>/tmp/status.err; S=$?
          curl -fsS --max-time 20 "http://127.0.0.1:8000/v1/models" > /tmp/models.json 2>/tmp/models.err; M=$?

          echo "### Endpoint checks (local backend)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Check | Result |" >> "$SUMMARY"
          echo "|---|---|" >> "$SUMMARY"
          if [ $H -eq 0 ]; then echo "| GET /health | OK |" >> "$SUMMARY"; else echo "| GET /health | WARN |" >> "$SUMMARY"; fi
          if [ $S -eq 0 ]; then echo "| GET /v1/status | OK |" >> "$SUMMARY"; else echo "| GET /v1/status | WARN |" >> "$SUMMARY"; fi
          if [ $M -eq 0 ]; then echo "| GET /v1/models | OK |" >> "$SUMMARY"; else echo "| GET /v1/models | WARN |" >> "$SUMMARY"; fi
          if [ -f gui/backend.json ]; then echo "| gui/backend.json | OK \`$(cat gui/backend.json)\` |" >> "$SUMMARY"; else echo "| gui/backend.json | WARN missing |" >> "$SUMMARY"; fi
          echo "" >> "$SUMMARY"

          echo "### Backend status" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          if [ $S -eq 0 ]; then
            PROVIDER=$(jq -r '.provider // .active_provider // "?"' /tmp/status.json 2>/dev/null || echo "?")
            MODEL=$(jq -r '.model // .active_model // "?"' /tmp/status.json 2>/dev/null || echo "?")
            OMNI=$(jq -r '.omniroute_reachable // .omniroute.reachable // "n/a"' /tmp/status.json 2>/dev/null || echo "n/a")
            OMC=$(jq -r '.omniroute.model_count // "n/a"' /tmp/status.json 2>/dev/null || echo "n/a")
            LOCAL=$(jq -r '.local_reachable // "n/a"' /tmp/status.json 2>/dev/null || echo "n/a")
            FALLBACK=$(jq -r '.fallback_active // "n/a"' /tmp/status.json 2>/dev/null || echo "n/a")
            REASONS=$(jq -r '(.reasons // []) | join(", ")' /tmp/status.json 2>/dev/null || echo "")
            echo "- **Active provider/model:** \`$PROVIDER\` / \`$MODEL\`" >> "$SUMMARY"
            echo "- **OmniRoute reachable:** \`$OMNI\`" >> "$SUMMARY"
            echo "- **OmniRoute model count:** \`$OMC\`" >> "$SUMMARY"
            echo "- **Local reachable:** \`$LOCAL\`" >> "$SUMMARY"
            echo "- **Fallback active:** \`$FALLBACK\`" >> "$SUMMARY"
            if [ -n "$REASONS" ]; then echo "- **Readiness reasons:** $REASONS" >> "$SUMMARY"; fi
          else
            echo "_No /v1/status JSON available._" >> "$SUMMARY"
          fi
          if [ $M -eq 0 ]; then
            MCOUNT=$(jq -r '(.models // []) | length' /tmp/models.json 2>/dev/null || echo "0")
            MSAMPLE=$(jq -r '(.models // [])[:8] | map(if type=="object" then (.id // .name // "?") else tostring end) | join(", ")' /tmp/models.json 2>/dev/null || echo "")
            echo "- **Discovered /v1/models:** \`$MCOUNT\`" >> "$SUMMARY"
            if [ -n "$MSAMPLE" ]; then echo "- **Sample models:** $MSAMPLE" >> "$SUMMARY"; fi
          fi
          echo "" >> "$SUMMARY"

          if [ -n "$TUNNEL_URL" ]; then
            TCODE=$(curl -sS -o /tmp/tunnel_health.json -w "%{http_code}" --max-time 20 "$TUNNEL_URL/health" || true)
            if [ "$TCODE" = "200" ]; then
              echo "- **Tunnel /health:** OK (200)" >> "$SUMMARY"
            else
              echo "- **Tunnel /health:** WARN (HTTP ${TCODE:-n/a}, may warm up; local backend authoritative)" >> "$SUMMARY"
            fi
          fi

          echo "" >> "$SUMMARY"
          echo "### Chat generation probe (best-effort, non-fatal)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          # Short generation probe to confirm at least one provider path can respond (may be degraded/fallback)
          CHAT_CODE=$(curl -sS -o /tmp/chat_probe.json -w "%{http_code}" --max-time 45 \
            -H "Content-Type: application/json" \
            -d '{"message":"Reply with the single word PONG","history":[],"session_id":"ci_smoke"}' \
            "http://127.0.0.1:8000/v1/chat" || true)
          if [ "$CHAT_CODE" = "200" ]; then
            CPROV=$(jq -r '.provider // "?"' /tmp/chat_probe.json 2>/dev/null || echo "?")
            CMODEL=$(jq -r '.model // "?"' /tmp/chat_probe.json 2>/dev/null || echo "?")
            CELAPSED=$(jq -r '.elapsed_ms // "?"' /tmp/chat_probe.json 2>/dev/null || echo "?")
            CRESP=$(jq -r '.response // ""' /tmp/chat_probe.json 2>/dev/null | tr '\n' ' ' | cut -c1-120)
            echo "- **POST /v1/chat:** OK (200) — provider: \`$CPROV\`, model: \`$CMODEL\`, elapsed_ms: \`$CELAPSED\`" >> "$SUMMARY"
            if [ -n "$CRESP" ]; then echo "- **Response preview:** ${CRESP}" >> "$SUMMARY"; fi
            if [ "$CPROV" = "fallback" ] || [ "$CPROV" = "unavailable" ] || [ "$CMODEL" = "unavailable" ]; then
              echo "- **Note:** generation degraded (fallback path). Check provider/upstream availability." >> "$SUMMARY"
            fi
          else
            echo "- **POST /v1/chat:** WARN (HTTP ${CHAT_CODE:-n/a}) — generation may be unavailable or slow in this environment." >> "$SUMMARY"
          fi

          echo ""
          echo "Smoke/summary step complete (non-fatal)." >> "$SUMMARY"

      - name: Keep backend alive
        if: always() && env.TUNNEL_URL != ''
        env:
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '350' }}
        run: |
          echo "Backend URL: $TUNNEL_URL"
          echo "Keeping alive for $DURATION_MINUTES minutes (while job runs)"
          end=$((SECONDS + DURATION_MINUTES*60))
          while [ $SECONDS -lt $end ]; do
            ts=$(date -u +%FT%TZ)
            if ! curl -fsS --max-time 10 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "[$ts] Local backend unhealthy; watchdogs will auto-restart services"
              tail -n 60 /tmp/uvicorn.log 2>/dev/null || true
            fi
            if ! curl -fsS --max-time 5 http://127.0.0.1:20128/v1/models >/dev/null 2>&1 && ! curl -fsS --max-time 5 http://127.0.0.1:20128/health >/dev/null 2>&1; then
              echo "[$ts] OmniRoute not reachable locally (backend may use fallback; watchdog active)"
            fi
            if ! curl -fsS --max-time 5 http://127.0.0.1:11434/v1/models >/dev/null 2>&1 && ! curl -fsS --max-time 5 http://127.0.0.1:11434/health >/dev/null 2>&1; then
              echo "[$ts] Local LLM not reachable locally (optional fallback; watchdog active)"
            fi
            sleep 30
          done
          echo "Duration reached, stopping"

